[workspace]
resolver = "3"
members = [
  "crates/agileplus-domain",
  "crates/agileplus-sqlite",
  "crates/agileplus-events",
  "crates/agileplus-dashboard",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.86"
authors = ["AgilePlus Team"]
repository = "https://github.com/AgilePlus/agileplus"
keywords = ["agile", "project-management", "software-development"]
categories = ["Software Development", "Project Management"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"
futures-util = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
tonic = { version = "0.13", features = ["transport"] }
tonic-build = { version = "0.13", features = ["prost"] }
prost = "0.13"
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = [
  "trace",
  "metrics",
  "http-proto",
  "reqwest-client",
] }
opentelemetry_sdk = { version = "0.31", features = [
  "trace",
  "metrics",
  "rt-tokio",
] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
time = ">=0.3.49"
trait-variant = "0.1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }

# Plugin crates (external from separate repos) — restored as local stubs for Planify2 standalone build
# agileplus-plugin-core = { git = "https://github.com/KooshaPari/agileplus-plugin-core" }
# agileplus-plugin-git = { git = "https://github.com/KooshaPari/agileplus-plugin-git" }
# agileplus-plugin-sqlite = { git = "https://github.com/KooshaPari/agileplus-plugin-sqlite" }

# Git operations
gix = "0.71"
git2 = "0.20"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
