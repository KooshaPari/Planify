[workspace]
members = [
    "crates/agileplus-sqlite",
    "crates/agileplus-mcp-intent",
    "crates/agileplus-cli",
    "crates/agileplus-trace-validator",
    "crates/agileplus-domain",
    "crates/agileplus-server",
    "crates/agileplus-plugin",
    "crates/agileplus-web",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
authors = ["AgilePlus Team"]
license = "MIT"
description = "Typed intent graphs for engineering work — convert prompts into validated DAGs of intents, features, tasks, tests, and edges, then store, query, and serve them from Rust, HTTP, or MCP."
repository = "https://github.com/phenotype/agileplus"
homepage = "https://github.com/phenotype/agileplus"
documentation = "https://docs.rs/agileplus-cli"
readme = "README.md"
keywords = ["intent-graph", "dag", "validation", "cli", "mcp"]
categories = ["development-tools", "data-structures"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tokio-stream = "0.1"
clap = { version = "4.4", features = ["derive", "env"] }
anyhow = "1.0"
rusqlite = { version = "0.30", features = ["bundled", "chrono", "uuid", "functions"] }

# Internal crates
agileplus-domain = { path = "crates/agileplus-domain", version = "0.3.0" }
agileplus-sqlite = { path = "crates/agileplus-sqlite", version = "0.3.0" }
agileplus-trace-validator = { path = "crates/agileplus-trace-validator", version = "0.3.0" }
agileplus-server = { path = "crates/agileplus-server", version = "0.3.0" }
agileplus-mcp-intent = { path = "crates/agileplus-mcp-intent", version = "0.3.0" }
