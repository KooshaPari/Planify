name: VitePress Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/pheno-vitepress-pages.yml
    with:
      concurrency_group: agileplus-vitepress-pages
      custom_domain: true
    permissions:
      contents: read
      pages: write
      id-token: write
