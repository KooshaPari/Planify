# CI pipeline for AgilePlus Rust workspace
#
# Runs on push to main and on all PRs.
# Only ubuntu-latest is used — no macOS/Windows runners per billing policy.
# Uses Swatinem/rust-cache for caching Rust compilation artifacts.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same workflow+ref (PR or branch) to avoid
# wasting CI on stale commits pushed before the previous run finished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Check ────────────────────────────────────────────────────────────────
  # Fast compilation check; also verifies MSRV (minimum Rust 1.75).
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo check — workspace
        run: cargo check --workspace

      - name: MSRV check (minimum Rust 1.75)
        # Verify the workspace still compiles with the minimum supported
        # Rust version (1.75). This catches accidental use of newer APIs.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75

      - name: cargo check — workspace (MSRV 1.75)
        run: cargo check --workspace

  # ── Test ─────────────────────────────────────────────────────────────────
  # Run the full test suite across the workspace.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo test — workspace
        run: cargo test --workspace --no-fail-fast 2>&1 | tee test-output.log

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

  # ── Lint ─────────────────────────────────────────────────────────────────
  # Clippy with -D warnings so the build fails on any lint violation.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy — workspace (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Size check ───────────────────────────────────────────────────────────
  # Warn on any .rs source file exceeding 500 lines, to encourage
  # modularity and keep files manageable.
  size-check:
    name: size-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for .rs files over 500 lines
        shell: bash
        run: |
          # Scan all .rs files outside target/ and warn when a file exceeds
          # the 500-line limit. This exits 0 (does not fail the build) so
          # the output serves as an advisory notice in the workflow log.
          echo "--- File size check: any .rs file over 500 lines ---"
          over_limit=0
          while IFS= read -r -d '' file; do
            lines=$(wc -l < "$file")
            if [ "$lines" -gt 500 ]; then
              echo "⚠️  WARNING: ${file#./} has $lines lines (exceeds 500-line limit)"
              over_limit=$((over_limit + 1))
            fi
          done < <(find . -name "*.rs" -not -path "./target/*" -print0)

          if [ "$over_limit" -gt 0 ]; then
            echo "--- $over_limit file(s) exceed the 500-line limit ---"
          else
            echo "✅ All .rs files are within the 500-line limit."
          fi
