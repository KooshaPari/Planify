name: Self-merge gate (local)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enforce independent approval
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: bash scripts/self-merge-gate.sh
