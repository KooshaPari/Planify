name: VitePress Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/vitepress-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  deploy:
    uses: ./.github/workflows/pheno-vitepress-pages.yml
    with:
      concurrency_group: agileplus-vitepress-pages
    permissions:
      contents: read
      pages: write
      id-token: write
