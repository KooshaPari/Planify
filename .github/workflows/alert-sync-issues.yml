name: Alert sync issues

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  issues: read

jobs:
  audit:
    name: Audit alert-labelled issues
    runs-on: ubuntu-latest
    steps:
      - name: List pending alert issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh issue list --state open --label auto-alert-sync --json number,title,labels
